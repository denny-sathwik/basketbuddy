<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Basket Buddy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-shopping-basket"></i>
                    <span>Basket Buddy</span>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search for products, brands, and more...">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
                
                <nav class="nav-links">
                    <a href="index.html" class="nav-link">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </a>
                    <a href="cart.html" class="nav-link">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Cart</span>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </a>
                    <a href="orders.html" class="nav-link active">
                        <i class="fas fa-box"></i>
                        <span>Orders</span>
                    </a>
                    <a href="#" class="nav-link" id="profileLink">
                        <i class="fas fa-user"></i>
                        <span id="userNameDisplay">Login</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Orders Section -->
    <section class="orders-section">
        <div class="container">
            <h1 class="page-title">
                <i class="fas fa-box"></i>
                My Orders
            </h1>
            
            <!-- Login Required State -->
            <div id="loginRequired" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2>Login Required</h2>
                <p>Please login to view your order history.</p>
                <a href="login.html?redirect=orders.html" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    Login to Continue
                </a>
            </div>
            
            <!-- Empty Orders State -->
            <div id="emptyOrders" class="empty-state" style="display: none;">
                <div class="empty-icon">
                    <i class="fas fa-box-open"></i>
                </div>
                <h2>No orders yet</h2>
                <p>You haven't placed any orders yet. Start shopping to see your orders here.</p>
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-shopping-bag"></i>
                    Start Shopping
                </a>
            </div>
            
            <!-- Orders List -->
            <div id="ordersContent" class="orders-content" style="display: none;">
                <div class="orders-filter">
                    <button class="filter-btn active" data-status="all">All Orders</button>
                    <button class="filter-btn" data-status="pending">Pending</button>
                    <button class="filter-btn" data-status="processing">Processing</button>
                    <button class="filter-btn" data-status="delivered">Delivered</button>
                    <button class="filter-btn" data-status="cancelled">Cancelled</button>
                </div>
                
                <div id="ordersList" class="orders-list">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Order Details</h2>
                <button class="modal-close" onclick="closeOrderModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="orderModalBody">
                <!-- Order details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
